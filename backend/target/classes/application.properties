server.port=8080
spring.application.name=retainiq-backend

# H2 Database (embedded, in-memory — mimics MySQL)
spring.datasource.url=jdbc:h2:mem:xenodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Python ML Service URL
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.retainiq=DEBUG
logging.level.org.springframework.web=INFO
